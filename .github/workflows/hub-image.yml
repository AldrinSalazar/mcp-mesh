# The hub's container image on the GitHub container registry. master
# publishes :edge; a v1.2.3 tag publishes :1.2.3, :1.2, :1 and :latest, a
# pre-release tag only its version. Pull requests build the image without
# publishing it.
name: Hub image

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version comes from git describe
      - name: Names
        id: names
        run: |
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mcp-mesh-hub" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.names.outputs.image }}
          # A pre-release tag (v1.2.0-rc.1) publishes only :1.2.0-rc.1.
          flavor: |
            latest=${{ contains(github.ref_name, '-') && 'false' || 'auto' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=mcp-mesh hub
            org.opencontainers.image.description=MCP tools, across your machines: the hub that nodes and AI clients connect to.
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
          annotations: |
            org.opencontainers.image.description=MCP tools, across your machines: the hub that nodes and AI clients connect to.
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: VERSION=${{ steps.names.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
